/* Layout: colonna unica. In alto il "cartellino" del trasferimento
   (Da, A, Cifra, Anno); in basso la barra di gioco ancorata.
   Stesse due pelli di Indovina il Giocatore: carta sportiva e notte. */
:root{
  --bg:#F6EDE6; --surface:#FFFBF8; --surface-2:#EDE0D7;
  --ink:#16211F; --ink-soft:#6A7772; --line:#DCC9BC;
  --accent:#0E5C4A; --accent-ink:#FFFFFF; --hot:#C8305B;
  --ok:#1F7A4D; --warn:#9A6514; --ok-bg:#DDEFE4; --warn-bg:#F6E7CC; --hot-bg:#F7DCE3;
  --scrim:rgba(5,7,12,.6);
  --shadow:0 1px 2px rgba(22,33,31,.08), 0 8px 24px -12px rgba(22,33,31,.22);
  --glow:none;
  --font-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-body:'Newsreader',Georgia,'Times New Roman',serif;
  --font-data:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070910; --surface:#0F1320; --surface-2:#161B2C;
    --ink:#E9EBF5; --ink-soft:#8891AB; --line:#222942;
    --accent:#3DDC97; --accent-ink:#04140C; --hot:#FF6B8A;
    --ok:#3DDC97; --warn:#F0B429; --ok-bg:#0F2A20; --warn-bg:#2C2210; --hot-bg:#2E1220;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.9);
    --glow:0 0 0 1px rgba(61,220,151,.14), 0 0 28px -10px rgba(61,220,151,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070910; --surface:#0F1320; --surface-2:#161B2C;
  --ink:#E9EBF5; --ink-soft:#8891AB; --line:#222942;
  --accent:#3DDC97; --accent-ink:#04140C; --hot:#FF6B8A;
  --ok:#3DDC97; --warn:#F0B429; --ok-bg:#0F2A20; --warn-bg:#2C2210; --hot-bg:#2E1220;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.9);
  --glow:0 0 0 1px rgba(61,220,151,.14), 0 0 28px -10px rgba(61,220,151,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 190px}

.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding-block:14px 12px;margin-bottom:18px}
.brandline{flex:1;min-width:0}
.kicker{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--hot)}
.wordmark{margin:2px 0 0;font-family:var(--font-display);font-variation-settings:'wdth' 118;font-weight:800;font-size:clamp(18px,5.2vw,30px);line-height:1;letter-spacing:-.015em;text-transform:uppercase;text-wrap:balance}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lang{display:flex;flex:none;background:var(--surface-2);border-radius:10px;padding:2px;gap:1px}
.lang button{border:0;background:transparent;border-radius:8px;width:30px;height:32px;font-family:var(--font-data);font-size:11px;font-weight:700;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:440px){.wordmark{font-variation-settings:'wdth' 90;font-size:clamp(16px,4.6vw,30px)}}
@media (max-width:420px){
  .iconbtn{width:32px;height:32px}
  .lang button{width:27px;height:28px}
}

.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.segment{display:grid;grid-template-columns:repeat(4,auto);width:100%;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.segment button{border:0;background:transparent;border-radius:999px;padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.segment button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:360px){.segment button{font-size:11.5px;padding:6px 5px}}

.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:7px;border-bottom:2px solid var(--ink)}
.sectionhead h2{margin:0;font-family:var(--font-display);font-variation-settings:'wdth' 112;font-weight:800;font-size:13px;letter-spacing:.11em;text-transform:uppercase}
.sectionhead span{font-family:var(--font-data);font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.ticket .top{padding:14px 16px 12px;border-bottom:1px dashed var(--line)}
.ticket .label{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.ticket .nome{margin:3px 0 0;font-family:var(--font-display);font-variation-settings:'wdth' 116;font-weight:800;font-size:clamp(22px,6.4vw,32px);line-height:1.05;letter-spacing:-.015em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.rotta{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 16px}
.rotta .lato{min-width:0}
.rotta .lato.dx{text-align:right}
.rotta .club{font-family:var(--font-display);font-variation-settings:'wdth' 108;font-weight:800;font-size:17px;line-height:1.15;text-transform:uppercase;overflow-wrap:anywhere}
.rotta .club.coperto{color:var(--ink-soft);letter-spacing:.22em;font-weight:700}
.freccia{display:flex;align-items:center;color:var(--accent)}
.freccia svg{width:46px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.voci{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.voce{padding:11px 16px;min-width:0}
.voce + .voce{border-left:1px solid var(--line)}
.voce .val{font-family:var(--font-data);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.voce .val.coperto{color:var(--ink-soft)}
.esito-green{color:var(--ok)!important}
.esito-yellow{color:var(--warn)!important}
.esito-red{color:var(--hot)!important}

.risposte{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:6px}
.risposta{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:9px 12px;border-left:4px solid var(--line)}
.risposta.green{border-left-color:var(--ok);background:var(--ok-bg)}
.risposta.yellow{border-left-color:var(--warn);background:var(--warn-bg)}
.risposta.red{border-left-color:var(--hot);background:var(--hot-bg)}
.risposta.attesa{background:transparent;border:1px dashed var(--line);border-left:4px solid var(--accent)}
.risposta.vuota{background:transparent;border:1px dashed var(--line);border-left:4px dashed var(--line);color:var(--ink-soft)}
.risposta .cosa{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);width:44px}
.risposta .tuo{min-width:0;font-weight:700;overflow-wrap:anywhere}
.risposta .tuo.piano{font-weight:500;color:var(--ink-soft)}
.risposta .verdetto{font-family:var(--font-data);font-size:11.5px;font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.risposta .nota{display:block;font-size:10.5px;color:var(--warn);font-weight:700;letter-spacing:.04em}

.tabellone{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:6px}
.riga{display:grid;grid-template-columns:22px 1fr auto auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.riga .num{font-family:var(--font-data);font-size:11px;color:var(--ink-soft)}
.riga .chi{min-width:0;overflow-wrap:anywhere}
.riga .chi b{display:block;font-size:14px}
.riga .chi span{font-size:12px;color:var(--ink-soft)}
.riga .quadri{display:flex;gap:3px}
.riga .quadri i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.riga .quadri i.green{background:var(--ok)} .riga .quadri i.yellow{background:var(--warn)} .riga .quadri i.red{background:var(--hot)}
.riga .quadri.testo{font-size:11px;color:var(--ink-soft)}
.riga .pt{font-family:var(--font-data);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}

.result{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.result.persa{border-left-color:var(--hot)}
.result h3{margin:0;font-family:var(--font-display);font-variation-settings:'wdth' 118;font-weight:800;font-size:clamp(19px,5vw,25px);line-height:1.1;text-transform:uppercase;letter-spacing:-.015em;text-wrap:balance}
.result p{margin:7px 0 0;font-family:var(--font-body);font-size:16px;color:var(--ink-soft)}
.result p b{color:var(--ink)}
.bignum{font-family:var(--font-data);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;margin-top:8px}
.bignum small{font-size:18px;color:var(--ink-soft)}
.resultactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.wide{width:100%;padding:12px 16px;font-size:15px;text-align:center}

.intro{font-family:var(--font-body);font-size:16.5px;color:var(--ink-soft);margin:0 0 14px;max-width:62ch}
.regole{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.regole li{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0}
.regole small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.regole b{font-family:var(--font-display);font-size:15px}
.regole span{display:block;font-size:12.5px;color:var(--ink-soft)}

.archivio{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:6px}
.giorno{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.giorno:hover{border-color:var(--accent)}
.giorno.oggi{border-color:var(--accent);box-shadow:var(--glow)}
.giorno .data{font-family:var(--font-data);font-size:12px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.giorno .stato{font-size:12.5px;color:var(--ink-soft);min-width:0;overflow-wrap:anywhere}
.giorno .stato b{font-weight:700;color:var(--ink)}
.giorno .stato .oggi{color:var(--accent)}
.giorno .stato.vinta b{color:var(--ok)}
.giorno .freccina{color:var(--ink-soft);font-size:17px;line-height:1}
.tornaindietro{display:inline-flex;align-items:center;gap:7px;background:transparent;border:0;padding:0;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.tornaindietro:hover{color:var(--accent)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dockinner{max-width:680px;margin:0 auto;position:relative}
.meter{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px;font-family:var(--font-data);font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.pips{display:flex;gap:5px;align-items:center}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pips i.fatto{background:var(--accent)}
.pips i.ora{background:var(--hot)}
.cuori{display:flex;gap:4px}
.cuori svg{width:15px;height:15px}
.cuori .pieno{fill:var(--hot);stroke:var(--hot)}
.cuori .vuoto{fill:none;stroke:var(--line);stroke-width:2}
.score{font-weight:700;color:var(--ink);white-space:nowrap}
.timer{font-weight:700;font-size:15px;color:var(--ink)}
.timer.basso{color:var(--hot)}
.barra{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:10px}
.barra i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.barra i.basso{background:var(--hot)}
.domanda{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.domanda b{font-family:var(--font-display);font-variation-settings:'wdth' 110;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.01em;min-width:0}
.aiuto{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--warn);white-space:nowrap;flex:none}
.aiuto:disabled{color:var(--ink-soft)}
.aiuto.neutro{color:var(--ink-soft)}
.suggerito{font-size:12.5px;color:var(--warn);font-weight:700;margin:-2px 0 8px}
.campo{display:flex;gap:8px}
.field{position:relative;flex:1;min-width:0}
.field input{width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:16px;font-family:var(--font-ui);font-weight:500}
.field input::placeholder{color:var(--ink-soft);font-weight:400}
.field input:focus{border-color:var(--accent);outline:none}
.suggest{position:absolute;left:0;right:0;bottom:calc(100% + 7px);background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);max-height:240px;overflow-y:auto}
.suggest button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;font-size:14.5px;font-weight:600}
.suggest button + button{border-top:1px solid var(--line)}
.suggest button[data-active="true"]{background:var(--surface-2);color:var(--accent)}
.legenda{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--ink-soft)}
.legenda.spazio{justify-content:space-between;align-items:center}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.legenda i{width:9px;height:9px;border-radius:3px}
.legenda i.green{background:var(--ok)} .legenda i.yellow{background:var(--warn)} .legenda i.red{background:var(--hot)}

/* Pulsante verso tutti i giochi del sito */
.tuttigiochi{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:28px;padding:14px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;font-family:var(--font-display);font-variation-settings:'wdth' 100;font-weight:800;font-size:14px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.tuttigiochi:hover{border-color:var(--accent);color:var(--accent)}
.tuttigiochi svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:380px){.tuttigiochi{font-size:12.5px;letter-spacing:0;gap:7px}}

.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:560px){.scrim{align-items:center}}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:460px;max-height:84vh;overflow-y:auto;padding:20px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 10px;font-family:var(--font-display);font-variation-settings:'wdth' 116;font-weight:800;font-size:20px;text-transform:uppercase}
.modal p,.modal li{font-family:var(--font-body);font-size:15.5px;color:var(--ink-soft)}
.modal ul{padding-left:18px;margin:8px 0}
.modal li b,.modal p b{color:var(--ink)}
.modal .piccolo{font-size:13.5px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 14px}
.statgrid div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;min-width:0}
.statgrid b{display:block;font-family:var(--font-data);font-size:20px;font-variant-numeric:tabular-nums}
.statgrid span{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

/* Dentro un iframe del sito (la pagina madre risponde al primo messaggio):
   altezza automatica, barra di gioco nel flusso e finestre in alto. */
html.incorporato,html.incorporato body{height:auto}
.incorporato .wrap{padding-block:0 20px}
.incorporato .masthead{position:static}
.incorporato .dock{position:static;padding:12px 0 0;margin-top:4px}
.incorporato #root{position:relative}
.incorporato .scrim{position:absolute;align-items:flex-start;padding-top:72px;min-height:100%}

@media (prefers-reduced-motion: no-preference){
  .ticket,.risposta,.result{animation:pop .34s cubic-bezier(.2,.8,.3,1) both}
}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
